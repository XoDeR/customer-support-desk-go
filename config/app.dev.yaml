app:
  environment: development
  auto_migrate: true
server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 30s
database:
  host: localhost
  port: 5432
  user: support
  password: support
  name: support_desk
  sslmode: disable
  max_open_conns: 10
redis:
  address: localhost:6379
  password: ""
  db: 0
jwt:
  secret: change-me-in-development
  access_ttl: 15m
  refresh_ttl: 168h
  issuer: customer-support-desk
admin:
  email: admin@example.com
  password: admin-password-change-me
agent:
  email: agent@example.com
  password: agent-password-change-me
storage:
  directory: ./data/attachments
  max_bytes: 10485760
internal_token: development-internal-token
