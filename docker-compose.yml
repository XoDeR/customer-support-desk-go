services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support_desk
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    profiles: ["app"]
    build: .
    depends_on: [postgres, redis]
    environment:
      DB_HOST: postgres
      REDIS_ADDR: redis:6379
    ports: ["8080:8080"]
    volumes: [attachments:/app/data/attachments]
volumes:
  postgres_data:
  attachments:
